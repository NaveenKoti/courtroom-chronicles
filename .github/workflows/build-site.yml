# Rebuilds the site whenever an episode JSON is added or changed, then asks GitHub Pages to publish it.
name: Build site

on:
  push:
    branches: [main]
    paths:
      - "data/episodes/**"
      - "site.json"
      - "build.py"
      - "assets/style.css"
      - "assets/app.js"
  schedule:
    - cron: "30 18 * * *"   # daily 18:30 UTC, after the 18:00 episode publish; also refreshes audio links from RSS
  workflow_dispatch:         # lets you press "Run workflow" by hand

permissions:
  contents: write
  pages: write

# Several episodes are committed within seconds of each other; run one build at a time.
concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (share images)
        run: pip install pillow

      - name: Refresh audio links from the RSS feed
        run: python3 fetch_audio.py || true

      - name: Build pages
        run: python3 build.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Build site"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Ask GitHub Pages to publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
